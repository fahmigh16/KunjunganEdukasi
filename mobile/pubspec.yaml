name: kunjungan_edukasi_mobile
description: "Aplikasi Mobile Reservasi Kunjungan Edukasi POLINELA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1
  
  # Local Storage for Token & Session
  shared_preferences: ^2.2.3
  
  # UI & Helpers
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
